# TigerMark · Gitee Go 自动打包发版
#
# 用法：
# 1. 打开 https://gitee.com/pytiger/tigermark →「流水线 / Gitee Go」
# 2. 新建流水线 → 选择「YAML 配置」→ 粘贴本文件内容
# 3. 触发方式建议设为：推送 Tag（如 v2.0.0）时自动运行
# 4. 首次运行前确认已开通 Gitee Go，并具备创建发行版权限
# 5. 在流水线密钥中配置 TAURI_SIGNING_PRIVATE_KEY（updater 私钥内容）
#
# 说明：
# - 云端默认是 Linux，只能打 AppImage / deb
# - macOS .dmg、Windows .exe 请在本机对应系统执行 npm run dist 后手动上传发行版附件
# - 单附件建议 < 100MB

name: release-linux
displayName: TigerMark Linux 打包发版

triggers:
  push:
    branches:
      exclude:
        - '**'
    tags:
      include:
        - 'v*'

stages:
  - name: build
    displayName: 构建
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_linux
        displayName: Node.js + Tauri 打包
        nodeVersion: 20.11.1
        commands:
          - node -v && npm -v
          - command -v rustc || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          - . "$HOME/.cargo/env"
          - rustc --version && cargo --version
          - |
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
            fi
          - npm ci
          - npm run dist -- --bundles appimage,deb
          - ls -lah src-tauri/target/release/bundle/appimage src-tauri/target/release/bundle/deb || true
        artifacts:
          - name: TIGERMARK_LINUX
            path:
              - src-tauri/target/release/bundle/appimage/*.AppImage
              - src-tauri/target/release/bundle/appimage/*.sig
              - src-tauri/target/release/bundle/deb/*.deb
        caches:
          - node_modules

  - name: publish
    displayName: 发版
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: 上传到 Gitee 发行版
        tagName: ${GITEE_TAG}
        releaseName: TigerMark ${GITEE_TAG}
        description: |
          ## TigerMark ${GITEE_TAG}

          ### Linux 安装包（流水线自动构建）
          - `.AppImage`：赋予执行权限后直接运行
          - `.deb`：`sudo dpkg -i xxx.deb`

          ### macOS / Windows
          请从本发行版附件中下载对应平台安装包（如由维护者本机打包上传）。
        upstreamArtifact:
          - TIGERMARK_LINUX
        assertFiles:
          - src-tauri/target/release/bundle/appimage/*.AppImage
          - src-tauri/target/release/bundle/deb/*.deb
        prerelease: false
        allowUpdate: true
